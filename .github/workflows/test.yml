name: Test PowerShell module

on:
  push:
  pull_request:

jobs:
  pester:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run tests with command coverage
        shell: pwsh
        run: ./tests/Invoke-HomepsickTests.ps1 -ReportDirectory ./artifacts/coverage/${{ matrix.os }}
      - name: Retain test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-coverage-${{ matrix.os }}
          path: artifacts/coverage/${{ matrix.os }}/
